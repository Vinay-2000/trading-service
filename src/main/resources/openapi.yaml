openapi: 3.0.3

info:
  title: Paper Trading - Trading Service API
  description: |
    API for creating and managing paper trading orders and trades.

    The Trading Service is responsible for:
    - Creating orders
    - Executing market orders
    - Managing pending limit orders
    - Recording trades
    - Exposing order and trade history

    Portfolio and holding updates are handled by the Portfolio Service
    after a trade is successfully executed.
  version: 1.0.0

servers:
  - url: http://localhost:8082
    description: Local development server

tags:
  - name: Orders
    description: Order management
  - name: Trades
    description: Trade information

paths:

  /api/v1/orders:
    post:
      tags:
        - Orders
      summary: Create an order
      description: |
        Creates a paper trading order.

        MARKET orders are executed immediately using the latest
        authoritative market price available to the backend.

        LIMIT orders are created with NEW status and are executed
        when the configured price condition is met.
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            examples:
              marketBuy:
                summary: Market buy
                value:
                  userId: 1
                  symbol: BTCUSDT
                  side: BUY
                  orderType: MARKET
                  quantity: 0.01

              limitBuy:
                summary: Limit buy
                value:
                  userId: 1
                  symbol: BTCUSDT
                  side: BUY
                  orderType: LIMIT
                  quantity: 0.01
                  limitPrice: 95000

      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'

        '400':
          description: Invalid order request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '409':
          description: Order cannot be executed because of a business conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /api/v1/orders/{orderId}:
    get:
      tags:
        - Orders
      summary: Get order by ID
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'

        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /api/v1/users/{userId}/orders:
    get:
      tags:
        - Orders
      summary: Get orders for a user
      operationId: getUserOrders
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: status
          in: query
          required: false
          description: Filter orders by status
          schema:
            $ref: '#/components/schemas/OrderStatus'

        - name: symbol
          in: query
          required: false
          description: Filter orders by trading symbol
          schema:
            type: string
            maxLength: 20
            example: BTCUSDT

      responses:
        '200':
          description: User orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'

        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /api/v1/orders/{orderId}/trades:
    get:
      tags:
        - Trades
      summary: Get trades for an order
      operationId: getOrderTrades
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Trades generated by the order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TradeResponse'

        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


components:

  parameters:

    OrderId:
      name: orderId
      in: path
      required: true
      description: Unique order ID
      schema:
        type: integer
        format: int64
        example: 1

    UserId:
      name: userId
      in: path
      required: true
      description: Unique user ID
      schema:
        type: integer
        format: int64
        example: 1


  schemas:

    CreateOrderRequest:
      type: object
      required:
        - userId
        - symbol
        - side
        - orderType
        - quantity

      properties:

        userId:
          type: integer
          format: int64
          description: User placing the order
          example: 1

        symbol:
          type: string
          maxLength: 20
          description: Trading symbol
          example: BTCUSDT

        side:
          $ref: '#/components/schemas/OrderSide'

        orderType:
          $ref: '#/components/schemas/OrderType'

        quantity:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Quantity of the asset to buy or sell
          example: 0.01

        limitPrice:
          type: number
          minimum: 0
          exclusiveMinimum: true
          nullable: true
          description: |
            Limit price.

            Required when orderType is LIMIT.
            Must be omitted for MARKET orders.
          example: 95000


    OrderResponse:
      type: object
      required:
        - id
        - userId
        - symbol
        - side
        - orderType
        - quantity
        - status
        - createdAt
        - updatedAt

      properties:

        id:
          type: integer
          format: int64
          example: 1

        userId:
          type: integer
          format: int64
          example: 1

        symbol:
          type: string
          example: BTCUSDT

        side:
          $ref: '#/components/schemas/OrderSide'

        orderType:
          $ref: '#/components/schemas/OrderType'

        quantity:
          type: number
          example: 0.01

        limitPrice:
          type: number
          nullable: true
          example: 95000

        status:
          $ref: '#/components/schemas/OrderStatus'

        createdAt:
          type: string
          format: date-time
          example: 2026-09-06T22:30:00Z

        updatedAt:
          type: string
          format: date-time
          example: 2026-09-06T22:30:00Z


    TradeResponse:
      type: object
      required:
        - id
        - orderId
        - userId
        - symbol
        - side
        - quantity
        - executionPrice
        - executedAt

      properties:

        id:
          type: integer
          format: int64
          example: 1

        orderId:
          type: integer
          format: int64
          example: 1

        userId:
          type: integer
          format: int64
          example: 1

        symbol:
          type: string
          example: BTCUSDT

        side:
          $ref: '#/components/schemas/OrderSide'

        quantity:
          type: number
          example: 0.01

        executionPrice:
          type: number
          description: Actual price at which the order was executed
          example: 100000

        executedAt:
          type: string
          format: date-time
          example: 2026-09-06T22:30:00Z


    OrderSide:
      type: string
      description: Order direction
      enum:
        - BUY
        - SELL


    OrderType:
      type: string
      description: Type of order
      enum:
        - MARKET
        - LIMIT


    OrderStatus:
      type: string
      description: Current order status
      enum:
        - NEW
        - FILLED
        - CANCELLED


    ErrorResponse:
      type: object
      required:
        - timestamp
        - status
        - error

      properties:

        timestamp:
          type: string
          format: date-time
          example: 2026-09-06T22:30:00Z

        status:
          type: integer
          example: 400

        error:
          type: string
          example: Invalid order request